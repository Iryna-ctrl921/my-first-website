    <div class="form-container">
        <h2>Вхід</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="login_email">Email:</label>
                <input type="email" id="login_email" name="email" required>
            </div>
            <div class="form-group">
                <label for="login_pwd">Пароль:</label>
                <input type="password" id="login_pwd" name="pwd" required>
            </div>
            <button type="submit">Увійти</button>
        </form>
    </div>
<div class="alert alert-success">
    <span><strong>Успіх!</strong> Ваші дані успішно збережено.</span>
    <button class="close-btn">&times;</button>
</div>

<div class="alert alert-warning">
    <span><strong>Увага!</strong> Перевірте правильність введеного Email.</span>
    <button class="close-btn">&times;</button>
</div>

<div class="alert alert-error">
    <span><strong>Помилка!</strong> Невірний пароль. Спробуйте ще раз.</span>
    <button class="close-btn">&times;</button>
</div>
